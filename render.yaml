services:
  # Backend Service
  - type: web
    name: lexifyd-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0

  # Frontend Service (Static Site)
  - type: web
    name: lexifyd-frontend
    env: static
    buildCommand: "cd frontend2 && npm install && npm run build"
    staticPublishPath: "frontend2/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          name: lexifyd-backend
          type: web
          property: host
